name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  og-complete:
    name: og snapshot completeness
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The snapshot check reads this site's own posts (the cards of our
      # pages are computed from them, lib/site-card.ts), which takes the MDX
      # loader's dependencies.
      - name: Install
        run: pnpm install --frozen-lockfile

      # Filesystem-only: enrich log.json with the committed snapshot and
      # fail if any cover-bearing media attachment has no runtime image, or
      # if a card of one of our own posts is stale.
      - name: Check attachment images
        run: pnpm og:complete

      # Filesystem-only: every <Badge> written in the MDX has its site's
      # official icon committed (content/badge-icons.json, public/badge-icons).
      - name: Check badge icons
        run: pnpm badges:check
