<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<meta name="robots" content="noindex">
<title>衣柜 · The Wardrobe</title>
<!--
  The Wardrobe: a dream, in three blinks.

  A tall thin man in black, under a round hat far too big for him, stood in
  my wardrobe. Then he opened its door and stood at my bed, looking at me.
  I woke, and the wardrobe door really was opening. As a child I saw him
  every few nights.

  Hold to close your eyes. Every time you open them, he is closer. The third
  time, you wake.

  One document, no dependencies: the home folder opens it in a window
  (content/apps.json), the Dream Lab frames it (/lab/wardrobe). It reads the
  site's locale from the same origin; `?lang=en|zh` overrides it, and
  `?stage=0..3` holds one frame still and `?quiet` hides the sound switch
  (the lab's surface, screenshots).
-->
<style>
  :root {
    --night: #05070d;
    --ink: #e6e9f2;
  }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--night);
    overflow: hidden;
    overscroll-behavior: none;
  }
  body {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    cursor: default;
    font-family: "Songti SC", "Noto Serif SC", "Source Han Serif SC", "Newsreader", Georgia, serif;
    color: var(--ink);
  }
  #stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--night);
  }
  svg#room {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    transition: filter 1.6s ease;
  }
  /* A child's breathing: the whole room, very slightly. Faster as he nears. */
  #breath {
    transform-origin: 50% 92%;
    animation: breathe var(--breath, 4.2s) ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    45% { transform: scale(1.012) translateY(-1px); }
  }
  body[data-stage="3"] svg#room { filter: brightness(1.55) saturate(0.55) contrast(0.92); }

  /* Film grain: one noise tile, jumped about. Cheap on a phone. */
  #grain {
    position: absolute;
    inset: -50%;
    pointer-events: none;
    opacity: 0.075;
    mix-blend-mode: screen;
    animation: grain 0.5s steps(5) infinite;
  }
  @keyframes grain {
    0% { transform: translate(0, 0); }
    20% { transform: translate(-7%, 4%); }
    40% { transform: translate(5%, -6%); }
    60% { transform: translate(-3%, -9%); }
    80% { transform: translate(8%, 6%); }
    100% { transform: translate(0, 0); }
  }
  #vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(120% 90% at 50% 45%, transparent 45%, rgba(0, 0, 0, 0.75) 100%);
  }

  /* The eyelids. Soft-edged, and they never quite meet the same way twice. */
  .lid {
    position: absolute;
    left: -10%;
    width: 120%;
    height: 62%;
    background: #000;
    pointer-events: none;
    transition: transform 0.26s cubic-bezier(0.5, 0, 0.3, 1);
    will-change: transform;
  }
  .lid::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    height: 18%;
    filter: blur(10px);
    background: #000;
  }
  #lid-top { top: 0; transform: translateY(-104%); border-radius: 0 0 50% 50% / 0 0 22% 22%; }
  #lid-top::after { bottom: -9%; border-radius: 50%; }
  #lid-bottom { bottom: 0; transform: translateY(104%); border-radius: 50% 50% 0 0 / 22% 22% 0 0; }
  #lid-bottom::after { top: -9%; border-radius: 50%; }
  body.closed #lid-top { transform: translateY(0); }
  body.closed #lid-bottom { transform: translateY(0); }
  body.opening .lid { transition-duration: 0.7s; transition-timing-function: cubic-bezier(0.2, 0.7, 0.2, 1); }

  /* Eyes just opened: out of focus, then in. */
  body.waking svg#room { filter: blur(5px) brightness(0.8); transition: none; }
  body[data-stage="3"].waking svg#room { filter: blur(6px) brightness(1.2) saturate(0.55); }

  .line {
    position: absolute;
    left: 0;
    right: 0;
    text-align: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 1.2s ease;
    letter-spacing: 0.08em;
  }
  #hint {
    bottom: calc(env(safe-area-inset-bottom, 0px) + 9%);
    font-size: 13px;
    color: rgba(230, 233, 242, 0.5);
  }
  #hint::before {
    content: "";
    display: block;
    width: 6px;
    height: 6px;
    margin: 0 auto 12px;
    border-radius: 50%;
    background: rgba(230, 233, 242, 0.5);
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.35; }
    50% { transform: scale(1.8); opacity: 0.8; }
  }
  #hint.show { opacity: 1; }
  #epilogue {
    top: 50%;
    transform: translateY(-50%);
    padding: 0 28px;
    font-size: 17px;
    line-height: 1.9;
    color: rgba(236, 238, 245, 0.88);
    text-shadow: 0 0 18px rgba(0, 0, 0, 0.9);
  }
  #epilogue small {
    display: block;
    margin-top: 28px;
    font-size: 12px;
    letter-spacing: 0.2em;
    color: rgba(236, 238, 245, 0.4);
  }
  #epilogue.show { opacity: 1; }
  #fade {
    position: absolute;
    inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.4s ease;
  }
  #fade.show { opacity: 0.62; }

  #sound {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 14px);
    right: 14px;
    width: 34px;
    height: 34px;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: rgba(230, 233, 242, 0.32);
    padding: 7px;
    cursor: pointer;
    z-index: 5;
  }
  #sound:hover { color: rgba(230, 233, 242, 0.6); }
  #sound svg { width: 100%; height: 100%; display: block; }
  #sound .off { display: none; }
  body.muted #sound .on { display: none; }
  body.quiet #sound { display: none; }
  body.muted #sound .off { display: block; }

  .glint { opacity: 0; transition: opacity 2.2s ease 1.4s; }
  body[data-stage="0"]:not(.closed) #eye0,
  body[data-stage="2"]:not(.closed):not(.waking) .glint.close { opacity: 1; }
  body[data-stage="0"]:not(.closed) #eye0 { transition-delay: 2.6s; }

  @media (prefers-reduced-motion: reduce) {
    #breath, #grain, #hint::before { animation: none; }
  }
</style>
</head>
<body data-stage="0">
<div id="stage">
  <svg id="room" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#0a0e1b"/>
        <stop offset="0.75" stop-color="#0e1426"/>
        <stop offset="1" stop-color="#0a0e1b"/>
      </linearGradient>
      <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#080b15"/>
        <stop offset="1" stop-color="#04060c"/>
      </linearGradient>
      <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#3c4e78"/>
        <stop offset="1" stop-color="#1b2642"/>
      </linearGradient>
      <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0" stop-color="#5a6d9c" stop-opacity="0.32"/>
        <stop offset="1" stop-color="#5a6d9c" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#8ea2d6" stop-opacity="0.12"/>
        <stop offset="1" stop-color="#8ea2d6" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#1a2440"/>
        <stop offset="1" stop-color="#101729"/>
      </linearGradient>
      <linearGradient id="doorFace" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#18213a"/>
        <stop offset="1" stop-color="#0d1322"/>
      </linearGradient>
      <linearGradient id="inside" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#0a1020"/>
        <stop offset="0.6" stop-color="#101830"/>
        <stop offset="1" stop-color="#0b1122"/>
      </linearGradient>
      <linearGradient id="blanket" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#1b2440"/>
        <stop offset="0.35" stop-color="#111829"/>
        <stop offset="1" stop-color="#070a12"/>
      </linearGradient>
      <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="6"/>
      </filter>
      <filter id="softer" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="18"/>
      </filter>
      <clipPath id="wardrobeInside">
        <rect x="213" y="222" width="145" height="418"/>
      </clipPath>

      <!-- The man, standing, feet at the origin. Very tall, very thin, all
           in black; arms hanging nearly to his knees; and the hat, round,
           with a brim far wider than his shoulders. -->
      <g id="man">
        <path d="M -27 -381 C -29 -404 -17 -419 0 -419 C 17 -419 29 -404 27 -381 Z"/>
        <ellipse cx="0" cy="-379" rx="76" ry="8.5"/>
        <ellipse cx="0" cy="-362" rx="12" ry="17"/>
        <rect x="-5" y="-350" width="10" height="16"/>
        <path d="M -24 -338 Q -28 -300 -19 -240 Q -16 -200 -21 -150 L -29 0 L 29 0 L 21 -150 Q 16 -200 19 -240 Q 28 -300 24 -338 Q 0 -344 -24 -338 Z"/>
        <path d="M -24 -338 Q -34 -332 -33 -300 L -32 -178 L -24 -178 L -25 -300 Q -25 -322 -20 -334 Z"/>
        <path d="M 24 -338 Q 34 -332 33 -300 L 32 -178 L 24 -178 L 25 -300 Q 25 -322 20 -334 Z"/>
        <path d="M -32 -179 L -34 -146 L -32.6 -146 L -30.6 -176 L -29.6 -144 L -28.2 -144 L -28 -176 L -26.4 -148 L -25 -148 L -24.4 -179 Z"/>
        <path d="M 32 -179 L 34 -146 L 32.6 -146 L 30.6 -176 L 29.6 -144 L 28.2 -144 L 28 -176 L 26.4 -148 L 25 -148 L 24.4 -179 Z"/>
      </g>
    </defs>

    <g id="breath">
      <!-- The room -->
      <rect x="-200" y="-200" width="790" height="840" fill="url(#wall)"/>
      <rect x="-200" y="640" width="790" height="400" fill="url(#floor)"/>
      <rect x="-200" y="636" width="790" height="5" fill="#141b30"/>

      <!-- The window, and the moon through it -->
      <ellipse cx="96" cy="282" rx="150" ry="170" fill="url(#moonGlow)"/>
      <rect x="40" y="172" width="112" height="214" fill="url(#glass)"/>
      <circle cx="122" cy="214" r="13" fill="#b9c5e6" opacity="0.55" filter="url(#soft)"/>
      <rect x="94" y="172" width="4" height="214" fill="#0b1020"/>
      <rect x="40" y="276" width="112" height="4" fill="#0b1020"/>
      <rect x="34" y="166" width="124" height="7" fill="#0b1020"/>
      <rect x="34" y="384" width="124" height="7" fill="#0b1020"/>
      <path d="M 16 158 C 40 230 26 330 44 404 L 0 410 L -10 158 Z" fill="#0b1020"/>
      <path d="M 142 158 C 150 220 132 300 150 402 L 176 404 C 166 300 180 220 170 158 Z" fill="#0b1020"/>
      <path d="M 40 386 L 152 386 L 330 700 L 120 700 Z" fill="url(#beam)" filter="url(#soft)"/>

      <!-- The wardrobe. Its inside is a hole; he lives there. -->
      <g id="wardrobe">
        <rect x="200" y="200" width="172" height="14" fill="#141c33"/>
        <rect x="205" y="212" width="161" height="430" fill="url(#wood)"/>
        <rect x="213" y="222" width="145" height="418" fill="url(#inside)"/>
        <g clip-path="url(#wardrobeInside)">
          <!-- Coats on the rail, barely there -->
          <rect x="213" y="244" width="145" height="2" fill="#070b16"/>
          <path d="M 220 246 L 214 410 L 236 412 L 232 246 Z" fill="#080c18"/>
          <path d="M 344 246 L 338 396 L 360 398 L 356 246 Z" fill="#080c18"/>
          <g id="manInside">
            <use href="#man" x="285.5" y="640" fill="#4a5c94" opacity="0.6" transform="translate(-1.6 0)"/>
            <use href="#man" x="285.5" y="640" fill="#000"/>
            <circle id="eye0" class="glint" cx="289.6" cy="277" r="1.5" fill="#d3dcf2"/>
          </g>
        </g>
        <!-- The doors: each hinged at its outer edge, drawn each frame -->
        <g id="doorL"><path class="face" fill="url(#doorFace)" stroke="#060910" stroke-width="1"/><path class="panels" fill="none" stroke="#1c2745" stroke-width="2"/><path class="handle" fill="#2a3658"/></g>
        <g id="doorR"><path class="face" fill="url(#doorFace)" stroke="#060910" stroke-width="1"/><path class="panels" fill="none" stroke="#1c2745" stroke-width="2"/><path class="handle" fill="#2a3658"/></g>
      </g>

      <!-- He is out. At my bed, taller than the room, looking down. -->
      <g id="close" opacity="0">
        <g id="closeBody">
          <use href="#man" fill="#4a5c94" opacity="0.5" transform="translate(-1.3 0)"/>
          <use href="#man" fill="#000"/>
          <circle class="glint close" cx="-5.4" cy="-360" r="0.95" fill="#d3dcf2"/>
          <circle class="glint close" cx="5.2" cy="-360.6" r="0.95" fill="#d3dcf2"/>
        </g>
      </g>

      <!-- The bed: my blanket, and me under it -->
      <path d="M -40 760 C 40 724 120 742 170 716 C 214 694 250 690 286 704 C 330 722 360 708 430 716 L 430 900 L -40 900 Z" fill="url(#blanket)"/>
      <path d="M -40 760 C 40 724 120 742 170 716 C 214 694 250 690 286 704 C 330 722 360 708 430 716" fill="none" stroke="#2c3962" stroke-width="1.4" opacity="0.7"/>
      <path d="M 60 790 C 120 770 180 790 230 770" fill="none" stroke="#0a0f1b" stroke-width="3" opacity="0.8"/>

    </g>
  </svg>

  <div id="grain"></div>
  <div id="vignette"></div>
  <div id="fade"></div>
  <div id="hint" class="line"></div>
  <div id="epilogue" class="line"></div>
  <div id="lid-top" class="lid"></div>
  <div id="lid-bottom" class="lid"></div>
  <button id="sound" type="button" aria-label="Sound">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 9h4l5-4v14l-5-4H4z"/>
      <path class="on" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>
      <path class="off" d="M17 9l5 6M22 9l-5 6"/>
    </svg>
  </button>
</div>

<script>
(() => {
  "use strict";

  // ---------------------------------------------------------------------------
  // Words. The site's locale, read from the same origin; ?lang= wins.
  // ---------------------------------------------------------------------------
  const params = new URLSearchParams(location.search);
  let lang = params.get("lang");
  if (lang !== "en" && lang !== "zh") {
    try { lang = localStorage.getItem("locale"); } catch { lang = null; }
  }
  if (lang !== "en" && lang !== "zh") lang = /^zh/i.test(navigator.language) ? "zh" : "en";
  document.documentElement.lang = lang;

  const WORDS = {
    zh: {
      hint: "按住，闭上眼睛",
      again: "再闭一次",
      epilogue: "小时候，他隔三差五就来看我。",
      replay: "轻触 · 再梦一次",
      sound: "声音",
    },
    en: {
      hint: "Hold to close your eyes",
      again: "Close them again",
      epilogue: "When I was little, he came to watch me every few nights.",
      replay: "Tap · dream it again",
      sound: "Sound",
    },
  }[lang];

  const $ = (id) => document.getElementById(id);
  const body = document.body;
  const svg = $("room");
  const hint = $("hint");
  const epilogue = $("epilogue");
  const fade = $("fade");
  const manInside = $("manInside");
  const close = $("close");
  const closeBody = $("closeBody");
  const soundButton = $("sound");
  soundButton.setAttribute("aria-label", WORDS.sound);

  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // A wide screen gets the whole room, letterboxed in the dark; a tall one
  // is filled by it. Quiet (a card, a widget), it is only the gap in the
  // wardrobe and what is behind it, filling whatever shape it is given.
  const quiet = params.has("quiet");
  function fit() {
    if (quiet) {
      svg.setAttribute("viewBox", "199 205 180 160");
      svg.setAttribute("preserveAspectRatio", "xMidYMid slice");
      return;
    }
    const wide = innerWidth / innerHeight > 0.62;
    svg.setAttribute("preserveAspectRatio", wide ? "xMidYMid meet" : "xMidYMid slice");
  }
  addEventListener("resize", fit);
  fit();

  // Grain: a noise tile drawn once.
  (() => {
    const c = document.createElement("canvas");
    c.width = c.height = 160;
    const g = c.getContext("2d");
    const img = g.createImageData(160, 160);
    for (let i = 0; i < img.data.length; i += 4) {
      const v = Math.random() * 255;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
      img.data[i + 3] = 255;
    }
    g.putImageData(img, 0, 0);
    $("grain").style.background = `url(${c.toDataURL()})`;
  })();

  // ---------------------------------------------------------------------------
  // The wardrobe's doors, each hinged at its outer edge, swinging toward the
  // bed. `open` is 0..1 (0 shut, 1 about 110 degrees). A plain perspective:
  // what comes toward the bed grows away from the middle of the view.
  // ---------------------------------------------------------------------------
  const TOP = 222, BOTTOM = 640, CX = 195, CY = 470;
  const DOORS = {
    L: { hinge: 213, dir: 1, width: 73, el: $("doorL") },
    R: { hinge: 358, dir: -1, width: 72, el: $("doorR") },
  };
  function project(x, y, z) {
    const s = 1 / (1 - z * 0.0026);
    return [CX + (x - CX) * s, CY + (y - CY) * s];
  }
  const poly = (q) => "M" + q.map((r) => r[0].toFixed(2) + " " + r[1].toFixed(2)).join(" L") + " Z";
  function drawDoor(door, open) {
    const a = open * 1.95; // radians
    const fx = door.hinge + door.dir * door.width * Math.cos(a);
    const fz = door.width * Math.sin(a);
    const p = (u, y) => project(door.hinge + (fx - door.hinge) * u, y, fz * u);
    const [face, panels, handle] = door.el.children;
    face.setAttribute("d", poly([p(0, TOP), p(1, TOP), p(1, BOTTOM), p(0, BOTTOM)]));
    const panel = (y0, y1) => poly([p(0.11, y0), p(0.89, y0), p(0.89, y1), p(0.11, y1)]);
    panels.setAttribute("d", panel(236, 416) + " " + panel(432, 622));
    handle.setAttribute("d", poly([p(0.9, 410), p(0.94, 410), p(0.94, 436), p(0.9, 436)]));
    // Seen edge-on and past it, the door's face turns from the moon: darker.
    door.el.style.filter = `brightness(${(0.72 + 0.36 * Math.cos(a)).toFixed(3)})`;
  }

  // ---------------------------------------------------------------------------
  // Sound: made here, nothing to download. Only after the first touch.
  // ---------------------------------------------------------------------------
  let ctx = null, master = null, room = null, muted = false;
  try { muted = sessionStorage.getItem("dream-muted") === "1"; } catch {}
  body.classList.toggle("muted", muted);

  function audio() {
    if (ctx) { if (ctx.state === "suspended") ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = muted ? 0 : 0.9;
    master.connect(ctx.destination);
    // Room tone: brown noise under a low lid.
    const len = ctx.sampleRate * 4;
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) {
      last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02;
      d[i] = last * 3.2;
    }
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.loop = true;
    const lp = ctx.createBiquadFilter();
    lp.type = "lowpass";
    lp.frequency.value = 260;
    room = ctx.createGain();
    room.gain.value = 0;
    room.gain.linearRampToValueAtTime(0.22, ctx.currentTime + 2);
    src.connect(lp).connect(room).connect(master);
    src.start();
  }

  function thump(t, strength) {
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(70, t);
    o.frequency.exponentialRampToValueAtTime(38, t + 0.16);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(strength, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.24);
    o.connect(g).connect(master);
    o.start(t);
    o.stop(t + 0.3);
  }

  let beatTimer = 0;
  function heartbeat(on, rate) {
    clearTimeout(beatTimer);
    if (!on || !ctx) return;
    const beat = () => {
      const t = ctx.currentTime + 0.02;
      thump(t, 0.9);
      thump(t + 0.17, 0.55);
      if (navigator.vibrate) navigator.vibrate([22, 140, 14]);
      beatTimer = setTimeout(beat, rate * 1000);
    };
    beat();
  }

  // A low swell under the moment the eyes open on him.
  function dread(level) {
    if (!ctx) return;
    const t = ctx.currentTime;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.18 + 0.14 * level, t + 0.5);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 3.6);
    g.connect(master);
    [41, 41.7, 61.5 + level * 3].forEach((f, i) => {
      const o = ctx.createOscillator();
      o.type = i === 2 ? "triangle" : "sine";
      o.frequency.value = f;
      const og = ctx.createGain();
      og.gain.value = i === 2 ? 0.25 : 0.6;
      o.connect(og).connect(g);
      o.start(t);
      o.stop(t + 3.8);
    });
    if (level >= 2) {
      // Something thin and high, almost not there.
      const o = ctx.createOscillator();
      const og = ctx.createGain();
      o.frequency.setValueAtTime(1760, t);
      o.frequency.linearRampToValueAtTime(1810, t + 3);
      og.gain.setValueAtTime(0.0001, t);
      og.gain.exponentialRampToValueAtTime(0.012, t + 1.2);
      og.gain.exponentialRampToValueAtTime(0.0001, t + 3.4);
      o.connect(og).connect(master);
      o.start(t);
      o.stop(t + 3.5);
    }
  }

  // A hinge: stick and slip. Clicks through a resonant body, irregular,
  // slowing, the pitch sliding as the door goes.
  function creak(duration) {
    if (!ctx) return;
    const t0 = ctx.currentTime + 0.05;
    const bp = ctx.createBiquadFilter();
    bp.type = "bandpass";
    bp.Q.value = 9;
    bp.frequency.setValueAtTime(520, t0);
    bp.frequency.linearRampToValueAtTime(760, t0 + duration * 0.55);
    bp.frequency.linearRampToValueAtTime(610, t0 + duration);
    const g = ctx.createGain();
    g.gain.value = 1.4;
    bp.connect(g).connect(master);
    const click = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.004), ctx.sampleRate);
    const cd = click.getChannelData(0);
    for (let i = 0; i < cd.length; i++) cd[i] = (Math.random() * 2 - 1) * (1 - i / cd.length);
    let t = t0;
    while (t < t0 + duration) {
      const u = (t - t0) / duration;
      const s = ctx.createBufferSource();
      s.buffer = click;
      const sg = ctx.createGain();
      sg.gain.value = 0.25 + 0.75 * Math.sin(Math.PI * Math.min(1, u * 1.2));
      s.connect(sg).connect(bp);
      s.start(t);
      t += 0.007 + 0.016 * u + Math.random() * 0.012 + (Math.random() < 0.05 ? 0.09 : 0);
    }
  }

  soundButton.addEventListener("pointerdown", (e) => e.stopPropagation());
  soundButton.addEventListener("click", (e) => {
    e.stopPropagation();
    muted = !muted;
    body.classList.toggle("muted", muted);
    try { sessionStorage.setItem("dream-muted", muted ? "1" : "0"); } catch {}
    if (master) master.gain.setTargetAtTime(muted ? 0 : 0.9, ctx.currentTime, 0.1);
  });

  // ---------------------------------------------------------------------------
  // The dream, in stages. Each one is what you see when you open your eyes.
  //
  //   0  the door ajar; something tall in the gap
  //   1  the door open; he is standing in the wardrobe, looking at me
  //   2  he is at my bed, bent over me
  //   3  awake. Grey morning light. The room is empty. And the door opens.
  //
  // Leave your eyes open and it still comes on, slowly: the door gives a
  // little, his head turns, the brim lowers.
  // ---------------------------------------------------------------------------
  let stage = 0;
  let closed = false;
  let closedAt = 0;
  let stageAt = performance.now();
  let ended = false;
  let busy = false; // between a release and the eyes being open again
  let hintTimer = 0;

  const ease = (u) => (u < 0 ? 0 : u > 1 ? 1 : u * u * (3 - 2 * u));

  // How far each door stands open, per stage, before anything moves.
  const OPEN = [
    { L: 0, R: 0.12 },
    { L: 0.74, R: 0.7 },
    { L: 0.74, R: 0.7 },
    { L: 0, R: 0 },
  ];

  function setStage(n) {
    stage = n;
    stageAt = performance.now();
    body.dataset.stage = String(n);
    body.style.setProperty("--breath", ["4.2s", "3.1s", "2.2s", "5s"][n]);
    manInside.style.display = n <= 1 ? "" : "none";
    close.setAttribute("opacity", n === 2 ? "1" : "0");
  }

  // Stage 2's man: his feet below the bed, his hat at the ceiling, leaning in.
  function placeClose(t) {
    const s = 1.9 + 0.1 * ease(t / 7);
    const lean = -2.5 - 1.5 * ease(t / 7);
    closeBody.setAttribute("transform", `translate(236 872) rotate(${lean.toFixed(3)}) scale(${s.toFixed(4)})`);
  }

  function frame(now) {
    const t = (now - stageAt) / 1000;
    let { L, R } = OPEN[stage];
    if (stage === 0) R += 0.06 * ease((t - 2) / 8);
    if (stage === 1) {
      L += 0.02 * Math.sin(t * 0.6);
      R += 0.02 * Math.sin(t * 0.7 + 1);
      // His head turns, a little, toward the bed.
      const tilt = -1.2 * ease((t - 1) / 3);
      manInside.setAttribute("transform", `rotate(${tilt.toFixed(2)} 285.5 640)`);
    } else {
      manInside.removeAttribute("transform");
    }
    if (stage === 2) placeClose(t);
    if (stage === 3) {
      // A breath of morning, then the door.
      R = 0.42 * ease((t - 1.6) / 3.2);
      if (!ended && t > 1.6) {
        ended = true;
        creak(3.2);
        setTimeout(() => { fade.classList.add("show"); epilogue.classList.add("show"); }, 4600);
      }
    }
    drawDoor(DOORS.L, L);
    drawDoor(DOORS.R, R);
    requestAnimationFrame(frame);
  }

  function showHint(text, delay) {
    clearTimeout(hintTimer);
    hint.classList.remove("show");
    hintTimer = setTimeout(() => {
      hint.textContent = text;
      hint.classList.add("show");
    }, delay);
  }

  // Eyes shut: the room goes, the heart comes up.
  function shut() {
    if (closed || busy || stage >= 3) return;
    audio();
    closed = true;
    closedAt = performance.now();
    clearTimeout(hintTimer);
    hint.classList.remove("show");
    body.classList.add("closed");
    body.classList.remove("opening");
    if (room) room.gain.setTargetAtTime(0.08, ctx.currentTime, 0.2);
    heartbeat(true, [0.82, 0.64, 0.5][stage]);
  }

  // Eyes open: on whatever is there now.
  function open() {
    if (!closed) return;
    closed = false;
    busy = true;
    // However short the blink, the lids stay down long enough to have been a blink.
    const held = performance.now() - closedAt;
    const wait = Math.max(0, 520 - held);
    setTimeout(() => {
      heartbeat(false);
      setStage(stage + 1);
      body.classList.add("waking", "opening");
      body.classList.remove("closed");
      if (room) room.gain.setTargetAtTime(stage === 3 ? 0.12 : 0.24, ctx.currentTime, 0.4);
      requestAnimationFrame(() => requestAnimationFrame(() => body.classList.remove("waking")));
      if (stage < 3) dread(stage);
      setTimeout(() => {
        busy = false;
        if (stage < 3) showHint(WORDS.again, 3200);
      }, 700);
    }, wait);
  }

  function restart() {
    epilogue.classList.remove("show");
    fade.classList.remove("show");
    body.classList.add("closed");
    setTimeout(() => {
      ended = false;
      setStage(0);
      body.classList.add("opening");
      body.classList.remove("closed");
      showHint(WORDS.hint, 1600);
    }, 900);
  }

  addEventListener("pointerdown", (e) => {
    if (e.button > 0) return;
    if (stage === 3) {
      if (epilogue.classList.contains("show")) { audio(); restart(); }
      return;
    }
    shut();
  });
  addEventListener("pointerup", open);
  addEventListener("pointercancel", open);
  addEventListener("blur", open);
  addEventListener("keydown", (e) => {
    if (e.repeat || (e.key !== " " && e.key !== "Enter")) return;
    e.preventDefault();
    if (stage === 3) { if (epilogue.classList.contains("show")) restart(); return; }
    shut();
  });
  addEventListener("keyup", (e) => { if (e.key === " " || e.key === "Enter") open(); });
  addEventListener("contextmenu", (e) => e.preventDefault());

  epilogue.innerHTML = `${WORDS.epilogue}<small>${WORDS.replay}</small>`;

  // ?quiet: no controls of its own (the lab's surface, which takes no taps).
  if (quiet) body.classList.add("quiet");

  // ?stage=n: one frame, held still.
  const still = params.get("stage");
  if (still !== null && /^[0-3]$/.test(still)) {
    setStage(Number(still));
    if (still === "3") { ended = true; stageAt = performance.now() - 6000; }
    if (params.has("epilogue")) { fade.classList.add("show"); epilogue.classList.add("show"); }
  } else {
    setStage(0);
    showHint(WORDS.hint, 1200);
  }
  if (reduced) body.style.setProperty("--breath", "0s");
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
