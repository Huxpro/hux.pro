<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" width="920" height="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="920" height="600" fill="#ffffff"/>

  <!-- ============ The catalog ============ -->
  <rect x="40" y="20" width="840" height="132" rx="10" fill="#f4f6fa" stroke="#7c8696" stroke-width="1.5"/>
  <text x="56" y="42" font-weight="600" fill="#111" font-size="13">systems/lab/catalog.ts</text>
  <text x="222" y="42" fill="#555">LABS: LabEntry[], in order · each: id, href, kind, name, mark, hint, blurb (en + zh)</text>

  <!-- entries -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
    <rect x="56" y="56" width="98" height="40" rx="6" fill="#ffffff" stroke="#b9c2cf"/>
    <text x="105" y="73" text-anchor="middle" fill="#111">works</text>
    <text x="105" y="88" text-anchor="middle" fill="#6b7280">study</text>

    <rect x="162" y="56" width="98" height="40" rx="6" fill="#ffffff" stroke="#b9c2cf"/>
    <text x="211" y="73" text-anchor="middle" fill="#111">attachments</text>
    <text x="211" y="88" text-anchor="middle" fill="#6b7280">study</text>

    <rect x="268" y="56" width="98" height="40" rx="6" fill="#ffffff" stroke="#b9c2cf"/>
    <text x="317" y="73" text-anchor="middle" fill="#111">icon</text>
    <text x="317" y="88" text-anchor="middle" fill="#6b7280">study</text>

    <rect x="374" y="56" width="98" height="40" rx="6" fill="#ffffff" stroke="#b9c2cf"/>
    <text x="423" y="73" text-anchor="middle" fill="#111">legibility</text>
    <text x="423" y="88" text-anchor="middle" fill="#6b7280">study</text>

    <rect x="480" y="56" width="98" height="40" rx="6" fill="#ffffff" stroke="#b9c2cf"/>
    <text x="529" y="73" text-anchor="middle" fill="#111">glow</text>
    <text x="529" y="88" text-anchor="middle" fill="#6b7280">study</text>

    <rect x="586" y="56" width="98" height="40" rx="6" fill="#ffffff" stroke="#b9c2cf"/>
    <text x="635" y="73" text-anchor="middle" fill="#111">band</text>
    <text x="635" y="88" text-anchor="middle" fill="#6b7280">study</text>

    <rect x="692" y="56" width="172" height="40" rx="6" fill="#eef4ff" stroke="#6f8fc8" stroke-width="1.5"/>
    <text x="778" y="73" text-anchor="middle" fill="#111">vitre</text>
    <text x="778" y="88" text-anchor="middle" fill="#3b5b8f">library + LibraryInfo</text>
  </g>
  <text x="56" y="118" fill="#555">LAB_GROUPS: library first, then study (the index and the switcher both follow it)</text>
  <text x="56" y="138" fill="#555">LibraryInfo (package, version, requires, npm) is read from packages/vitre/package.json, never retyped</text>

  <!-- ============ Per lab ============ -->
  <text x="60" y="186" font-weight="600" fill="#111" font-size="13">Per lab</text>

  <!-- surfaces -->
  <rect x="60" y="198" width="240" height="132" rx="10" fill="#fbfcfe" stroke="#7c8696" stroke-width="1.5"/>
  <text x="74" y="220" font-weight="600" fill="#111">systems/lab/surfaces/&lt;id&gt;.tsx</text>
  <text x="74" y="242" fill="#444">the lab at a glance, live</text>
  <text x="74" y="262" fill="#444" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">LAB_SURFACES:</text>
  <text x="74" y="278" fill="#444" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">  Record&lt;LabId, ComponentType&gt;</text>
  <text x="74" y="298" fill="#444">drawn in SurfaceFrame; words in</text>
  <text x="74" y="314" fill="#444">surfaces/strings.ts</text>

  <!-- route folder -->
  <rect x="320" y="198" width="280" height="132" rx="10" fill="#fbfcfe" stroke="#7c8696" stroke-width="1.5"/>
  <text x="334" y="220" font-weight="600" fill="#111">app/lab/&lt;id&gt;/</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
    <text x="334" y="244" fill="#111">page.tsx</text>
    <text x="334" y="270" fill="#111">view.tsx</text>
    <text x="334" y="296" fill="#111">strings.ts</text>
  </g>
  <text x="410" y="244" fill="#444">metadata (a study: noindex)</text>
  <text x="410" y="270" fill="#444">the lab, inside its shell</text>
  <text x="410" y="296" fill="#444">LabTable: en, zh: typeof en</text>
  <text x="410" y="314" fill="#444">read with useLabStrings</text>

  <!-- library content -->
  <rect x="620" y="198" width="240" height="132" rx="10" fill="#eef4ff" stroke="#6f8fc8" stroke-width="1.5"/>
  <text x="634" y="220" font-weight="600" fill="#111">a library only</text>
  <text x="634" y="242" fill="#444">app/lab/vitre/api/ and site/ beside it</text>
  <text x="634" y="264" fill="#444">its words stay in the package:</text>
  <text x="634" y="282" fill="#444" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">packages/vitre/site/src/docs/</text>
  <text x="634" y="298" fill="#444" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">  sections.tsx, api.ts</text>
  <text x="634" y="318" fill="#3b5b8f">api.ts is checked against vitre.d.ts</text>

  <!-- ============ What renders ============ -->
  <text x="60" y="396" font-weight="600" fill="#111" font-size="13">What renders</text>

  <!-- index + widget -->
  <rect x="60" y="408" width="240" height="172" rx="10" fill="#fbfcfe" stroke="#7c8696" stroke-width="1.5"/>
  <text x="74" y="430" font-weight="600" fill="#111">/lab</text>
  <text x="74" y="448" fill="#444" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">app/lab/index-view.tsx</text>
  <text x="74" y="468" fill="#444">a card per lab wearing its surface;</text>
  <text x="74" y="484" fill="#444">a library wide, with LibraryFacts</text>
  <line x1="74" y1="498" x2="286" y2="498" stroke="#d5dbe3"/>
  <text x="74" y="518" font-weight="600" fill="#111">Home Lab widget</text>
  <text x="74" y="536" fill="#444" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">components/home/lab-widget.tsx</text>
  <text x="74" y="554" fill="#444">rotates the surfaces; off until</text>
  <text x="74" y="570" fill="#444">added (widgets.ts, defaultEnabled)</text>

  <!-- LabShell -->
  <rect x="320" y="408" width="560" height="172" rx="10" fill="#fbfcfe" stroke="#7c8696" stroke-width="1.5"/>
  <text x="334" y="430" font-weight="600" fill="#111">LabShell</text>
  <text x="396" y="430" fill="#444" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">systems/lab/components/shell.tsx</text>
  <!-- bar mock -->
  <rect x="334" y="442" width="512" height="34" rx="12" fill="#ffffff" stroke="#9ab" stroke-width="1"/>
  <text x="348" y="463" fill="#555" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">λhux /</text>
  <rect x="392" y="450" width="82" height="18" rx="4" fill="#eef4ff"/>
  <text x="433" y="463" text-anchor="middle" fill="#111">LabNav ▾</text>
  <rect x="480" y="450" width="54" height="18" rx="4" fill="#eef4ff"/>
  <text x="507" y="463" text-anchor="middle" fill="#111">(i) info</text>
  <rect x="542" y="450" width="58" height="18" rx="4" fill="#f1f3f6"/>
  <text x="571" y="463" text-anchor="middle" fill="#444">tools</text>
  <rect x="608" y="450" width="122" height="18" rx="4" fill="#f1f3f6"/>
  <text x="669" y="463" text-anchor="middle" fill="#444">meta (xl and up)</text>
  <rect x="738" y="450" width="98" height="18" rx="4" fill="#f1f3f6"/>
  <text x="787" y="463" text-anchor="middle" fill="#444">actions</text>
  <text x="334" y="496" fill="#444">LabNav lists LABS by LAB_GROUPS; (i) shows the entry's blurb. Pinned in the band (pin)</text>
  <text x="334" y="520" fill="#111">layout:</text>
  <text x="380" y="520" fill="#444" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">document | workbench (stage + LabPanel) | canvas</text>
  <line x1="334" y1="534" x2="846" y2="534" stroke="#d5dbe3"/>
  <text x="334" y="552" fill="#3b5b8f" font-weight="600">LibraryShell</text>
  <text x="414" y="552" fill="#444">wraps LabShell: Docs (canvas), API and On hux.pro (document);</text>
  <text x="334" y="570" fill="#444">the three pages are the bar's actions; LibraryHeader reads the entry's LibraryInfo</text>

  <!-- ============ Arrows ============ -->
  <!-- catalog to index/widget: down the left margin -->
  <path d="M48 152 V572 H58" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M48 430 H58" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- surfaces to index/widget -->
  <path d="M180 330 V406" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="188" y="372" fill="#555" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">LAB_SURFACES[id]</text>
  <!-- view to shell -->
  <path d="M460 330 V406" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="452" y="364" text-anchor="end" fill="#555">view.tsx renders in</text>
  <text x="452" y="380" text-anchor="end" fill="#555">LabShell or LibraryShell</text>
  <!-- library content to shell -->
  <path d="M740 330 V406" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="732" y="364" text-anchor="end" fill="#555">LibraryApi, via</text>
  <text x="732" y="380" text-anchor="end" fill="#555" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">app/lab/vitre/api.ts</text>
  <!-- catalog to shell: down the right margin -->
  <path d="M872 152 V406" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="866" y="186" text-anchor="end" fill="#555">entry by id</text>
</svg>
