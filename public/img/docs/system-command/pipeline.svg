<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 620" width="640" height="620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="620" fill="#ffffff"/>

  <text x="150" y="22" font-size="12" font-weight="700" fill="#7a5a00" text-anchor="middle">ASK</text>
  <text x="490" y="22" font-size="12" font-weight="700" fill="#1f4e8c" text-anchor="middle">PALETTE</text>

  <!-- Row 1 -->
  <rect x="10" y="34" width="280" height="122" rx="9" fill="#fff6dc" stroke="#c9a227" stroke-width="1.5"/>
  <text x="22" y="55" font-size="13" font-weight="700" fill="#222">systems/command/catalog.ts</text>
  <text x="22" y="75" fill="#333" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">COMMAND_CATALOG[id]</text>
  <text x="22" y="95" fill="#444">title { en, zh } · description</text>
  <text x="22" y="113" fill="#444">options[]: the finite targets</text>
  <text x="22" y="131" fill="#444">policy.execution: on-request |</text>
  <text x="22" y="148" fill="#444">user-gesture (+ gestureValues)</text>

  <rect x="350" y="34" width="280" height="122" rx="9" fill="#e6f0fb" stroke="#4a7fc1" stroke-width="1.5"/>
  <text x="362" y="55" font-size="13" font-weight="700" fill="#222">systems/command/actions.tsx</text>
  <text x="362" y="75" fill="#333" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">useCommandActions()</text>
  <text x="362" y="95" fill="#444">id: CommandId · key · section</text>
  <text x="362" y="113" fill="#444">kind: navigate | surface | toggle | stay</text>
  <text x="362" y="131" fill="#444">slashOnly · searchOnly · label</text>
  <text x="362" y="148" fill="#444">keywords · run(ctx)</text>

  <line x1="290" y1="95" x2="346" y2="95" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="318" y="87" font-size="11" fill="#555" text-anchor="middle">types id</text>

  <!-- Row 2 -->
  <line x1="150" y1="156" x2="150" y2="192" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="10" y="196" width="280" height="112" rx="9" fill="#fffaf0" stroke="#c9a227" stroke-width="1.2"/>
  <text x="22" y="217" font-size="13" font-weight="700" fill="#222">ask/lib/command-tools.ts</text>
  <text x="22" y="237" fill="#333" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">command_&lt;id&gt; per id</text>
  <text x="22" y="257" fill="#444">description + a policy sentence</text>
  <text x="22" y="275" fill="#444">execution: offer | apply</text>
  <text x="22" y="293" fill="#444">value: enum of options · list_commands</text>

  <line x1="418" y1="156" x2="418" y2="192" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="562" y1="156" x2="562" y2="192" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="350" y="196" width="136" height="112" rx="9" fill="#f2f7fd" stroke="#4a7fc1" stroke-width="1.2"/>
  <text x="358" y="217" font-size="12" font-weight="700" fill="#222">CommandResults</text>
  <text x="358" y="237" font-size="11" fill="#666">results.tsx</text>
  <text x="358" y="257" font-size="11.5" fill="#444">search rows,</text>
  <text x="358" y="275" font-size="11.5" fill="#444">minus slashOnly;</text>
  <text x="358" y="293" font-size="11.5" fill="#444">searchOnly if typed</text>

  <rect x="494" y="196" width="136" height="112" rx="9" fill="#f2f7fd" stroke="#4a7fc1" stroke-width="1.2"/>
  <text x="502" y="217" font-size="12" font-weight="700" fill="#222">CommandSlashList</text>
  <text x="502" y="237" font-size="11" fill="#666">+ SlashShortcuts</text>
  <text x="502" y="257" font-size="11.5" fill="#444">key and label,</text>
  <text x="502" y="275" font-size="11.5" fill="#444">minus searchOnly;</text>
  <text x="502" y="293" font-size="11.5" fill="#444">every letter runs</text>

  <!-- Row 3 -->
  <line x1="150" y1="308" x2="150" y2="344" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="160" y="331" font-size="11" fill="#555">the model's tool call</text>
  <rect x="10" y="348" width="280" height="146" rx="9" fill="#fffaf0" stroke="#c9a227" stroke-width="1.2"/>
  <text x="22" y="369" font-size="13" font-weight="700" fill="#222">ask/lib/execute-command.ts</text>
  <text x="22" y="389" fill="#333" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">executeAskCommand</text>
  <text x="22" y="409" fill="#444">unavailable, bad value → error</text>
  <text x="22" y="427" fill="#444">offer card if not "apply", hidden,</text>
  <text x="22" y="445" fill="#444">user-gesture, or no target</text>
  <text x="22" y="463" fill="#444">(commandOfferReason)</text>
  <text x="22" y="483" fill="#444">else host.runCommand(id, value)</text>

  <line x1="418" y1="308" x2="418" y2="344" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="562" y1="308" x2="562" y2="344" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="350" y="348" width="280" height="146" rx="9" fill="#f2f7fd" stroke="#4a7fc1" stroke-width="1.2"/>
  <text x="362" y="369" font-size="13" font-weight="700" fill="#222">actions.tsx</text>
  <text x="362" y="389" fill="#333" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">useRunCommand()</text>
  <text x="362" y="409" fill="#444">(action, "search" | "slash")</text>
  <text x="362" y="427" fill="#444">run, then: stay → nothing;</text>
  <text x="362" y="445" fill="#444">toggle from search → stays;</text>
  <text x="362" y="463" fill="#444">else useCommandShell().leave(kind)</text>
  <text x="362" y="483" fill="#444">popover closes; sheet may stay</text>

  <!-- Row 4 -->
  <rect x="140" y="540" width="360" height="66" rx="9" fill="#eef7ee" stroke="#4c9a52" stroke-width="1.5"/>
  <text x="320" y="565" font-size="13" font-weight="700" fill="#222" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">CommandAction.run(ctx)</text>
  <text x="320" y="588" fill="#444" text-anchor="middle">{ key } from a letter · { value } from Ask</text>

  <path d="M70,494 L70,573 L136,573" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="80" y="520" font-size="11" fill="#555">actions-host.ts</text>
  <path d="M570,494 L570,573 L504,573" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
