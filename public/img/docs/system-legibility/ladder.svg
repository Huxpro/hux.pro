<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 870" width="660" height="870" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">
  <rect width="660" height="870" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#444"/>
    </marker>
  </defs>
  <style>
    .t { font-size: 14px; font-weight: 600; fill: #111; }
    .s { font-size: 12px; fill: #555; }
    .h { font-size: 11px; fill: #777; letter-spacing: 0.04em; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; fill: #111; }
    .mg { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; fill: #666; }
    .bad { font-size: 12px; fill: #a3361f; }
    .box { fill: #f6f6f6; stroke: #bbb; stroke-width: 1; }
    .ladder { fill: #ececec; stroke: #444; stroke-width: 1.5; }
    .ln { stroke: #444; stroke-width: 1.3; fill: none; }
    .dash { stroke: #444; stroke-width: 1.3; fill: none; stroke-dasharray: 5 4; }
    .dbox { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 5 4; }
  </style>

  <!-- Inputs -->
  <rect class="box" x="20" y="20" width="320" height="216" rx="8"/>
  <text class="t" x="34" y="44">Inputs</text>
  <text class="s" x="34" y="62">:root (light) / .dark, app/globals.css</text>
  <text class="m" x="34" y="90">--ink</text><text class="mg" x="214" y="90">0.145 / 0.93</text>
  <text class="m" x="34" y="112">--ink-alpha-reading</text><text class="mg" x="214" y="112">85%</text>
  <text class="m" x="34" y="134">--ink-alpha-secondary</text><text class="mg" x="214" y="134">54% / 60%</text>
  <text class="m" x="34" y="156">--ink-alpha-tertiary</text><text class="mg" x="214" y="156">32% / 36%</text>
  <text class="m" x="34" y="178">--ink-alpha-quaternary</text><text class="mg" x="214" y="178">20% / 22%</text>
  <text class="m" x="34" y="200">--wash-alpha-*</text><text class="mg" x="214" y="200">4–10%</text>
  <text class="m" x="34" y="222">--relief-theme-*</text><text class="mg" x="214" y="222">shadow shape</text>

  <!-- Wallpaper inputs -->
  <rect class="box" x="352" y="20" width="288" height="216" rx="8"/>
  <text class="t" x="366" y="44">Wallpaper inputs</text>
  <text class="s" x="366" y="62">applyLegibility() writes them on &lt;html&gt;</text>
  <text class="m" x="366" y="90">--wp-ink-boost</text>
  <text class="m" x="366" y="112">--wp-lift-secondary / -tertiary</text>
  <text class="m" x="366" y="134">--wp-relief</text>
  <text class="m" x="366" y="156">--wp-zone-boost</text>
  <text class="mg" x="380" y="178">← --wp-bare-boost</text>
  <text class="s" x="366" y="200">in .ink-bare / .ink-bare-mid only;</text>
  <text class="s" x="366" y="216">0 everywhere else</text>

  <!-- arrows into the ladder -->
  <path class="ln" d="M180 236 V266" marker-end="url(#a)"/>
  <path class="ln" d="M496 236 V266" marker-end="url(#a)"/>

  <!-- THE LADDER -->
  <rect class="ladder" x="20" y="272" width="620" height="356" rx="8"/>
  <text class="t" x="34" y="296">THE LADDER</text>
  <text class="s" x="34" y="314">declared on :root, .ink-scope, .ink-flip, .ink-bare, .ink-bare-mid</text>
  <text class="h" x="34" y="342">TOKEN</text><text class="h" x="214" y="342">MIXED FROM --ink AT</text><text class="h" x="406" y="342">WHAT YOU WRITE</text>

  <text class="m" x="34" y="368">--foreground</text><text class="mg" x="214" y="368">100%</text><text class="m" x="406" y="368">text-foreground</text>
  <text class="m" x="34" y="394">--reading-foreground</text><text class="mg" x="214" y="394">reading</text><text class="m" x="406" y="394">text-reading-foreground</text>
  <text class="m" x="34" y="420">--muted-foreground</text><text class="mg" x="214" y="420">secondary</text><text class="m" x="406" y="420">text-muted-foreground</text>
  <text class="mg" x="224" y="436">+ boost + zone + lift</text>
  <text class="m" x="34" y="462">--tertiary-foreground</text><text class="mg" x="214" y="462">tertiary</text><text class="m" x="406" y="462">text-tertiary-foreground</text>
  <text class="mg" x="224" y="478">+ boost + zone + lift</text>
  <text class="m" x="34" y="504">--quaternary-foreground</text><text class="mg" x="214" y="504">quaternary</text><text class="m" x="406" y="504">text-quaternary-foreground</text>
  <text class="mg" x="224" y="520">+ boost + zone</text>
  <text class="m" x="34" y="546">--muted --border</text><text class="mg" x="214" y="546">wash</text><text class="m" x="406" y="546">bg-muted/50</text>
  <text class="m" x="34" y="562">--accent-wash</text><text class="m" x="406" y="562">border-border</text>
  <text class="m" x="34" y="588">--text-relief</text><text class="mg" x="214" y="588">relief-* × --wp-relief</text><text class="m" x="406" y="588">text-shadow</text>
  <text class="s" x="34" y="614">each is color-mix(in oklab, var(--ink) N%, transparent), inherited as a finished colour</text>

  <path class="ln" d="M375 364 H398" marker-end="url(#a)"/>
  <path class="ln" d="M375 390 H398" marker-end="url(#a)"/>
  <path class="ln" d="M375 416 H398" marker-end="url(#a)"/>
  <path class="ln" d="M375 458 H398" marker-end="url(#a)"/>
  <path class="ln" d="M375 500 H398" marker-end="url(#a)"/>
  <path class="ln" d="M375 542 H398" marker-end="url(#a)"/>
  <path class="ln" d="M384 584 H398" marker-end="url(#a)"/>

  <!-- ink-line: an input, not on the ladder -->
  <rect class="dbox" x="20" y="642" width="620" height="58" rx="8"/>
  <text class="m" x="34" y="666">--ink-line</text><text class="mg" x="214" y="666">0.4, written out</text><text class="m" x="406" y="666">decoration-ink-line</text>
  <path class="dash" d="M384 662 H398" marker-end="url(#a)"/>
  <text class="s" x="34" y="688">Not mixed and not on the ladder: Safari draws no color-mix() as a text decoration.</text>

  <!-- Zone -->
  <rect class="box" x="20" y="718" width="620" height="132" rx="8"/>
  <text class="t" x="34" y="742">A zone that changes the ink</text>
  <text class="m" x="34" y="766">html[data-wallpaper-flip] .ink-bare {</text>
  <text class="m" x="50" y="782">--ink: var(--ink-inverse); --ink-line: var(--ink-line-inverse);</text>
  <text class="m" x="50" y="798">--relief-rgb / -a1 / -a2 / -y / -b1 / -b2: the inverse pair }</text>
  <text class="s" x="34" y="820">In the ladder's selector list: every token above re-derives from the inverse ink.</text>
  <text class="bad" x="34" y="838">Not in the list: only --ink changes; the rungs arrive already mixed from the root's ink.</text>
</svg>
