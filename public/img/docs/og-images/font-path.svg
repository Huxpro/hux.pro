<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/>
    </marker>
  </defs>
  <rect width="960" height="500" fill="#ffffff"/>

  <!-- Column headings -->
  <text x="30" y="34" font-size="12" font-weight="600" fill="#666" letter-spacing="0.5">ONCE, ON YOUR MACHINE (NETWORK)</text>
  <text x="350" y="34" font-size="12" font-weight="600" fill="#666" letter-spacing="0.5">EVERY BUILD (NO NETWORK MEANT)</text>
  <text x="670" y="34" font-size="12" font-weight="600" fill="#666" letter-spacing="0.5">EACH GLYPH SATORI DRAWS</text>

  <!-- Bake -->
  <rect x="30" y="50" width="270" height="118" rx="8" fill="#f4f4f4" stroke="#bbb"/>
  <text x="46" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600">pnpm og:fonts</text>
  <text x="46" y="96" fill="#555">scripts/og-fonts.mjs</text>
  <text x="46" y="120">text = printable Latin</text>
  <text x="46" y="138">  + COMMON_HANZI cushion</text>
  <text x="46" y="156">  + every post's title, description</text>

  <line x1="165" y1="168" x2="165" y2="206" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="174" y="192" fill="#555" font-size="12">Google Fonts, subset</text>

  <!-- Baked files -->
  <rect x="30" y="210" width="270" height="132" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="46" y="236" font-weight="600">lib/og-fonts/ (committed)</text>
  <text x="46" y="262" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">newsreader-400.ttf</text>
  <text x="284" y="262" text-anchor="end" fill="#555" font-size="12">OgSerif</text>
  <text x="46" y="284" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">jetbrains-mono-400.ttf</text>
  <text x="284" y="284" text-anchor="end" fill="#555" font-size="12">OgMono</text>
  <text x="46" y="306" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">noto-serif-sc-400.ttf</text>
  <text x="284" y="306" text-anchor="end" fill="#b3261e" font-size="12">OgSerif (2nd)</text>
  <text x="46" y="328" fill="#b3261e" font-size="12">never reached: same name as Newsreader</text>

  <line x1="300" y1="276" x2="346" y2="276" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Build -->
  <rect x="350" y="50" width="270" height="292" rx="8" fill="#f4f4f4" stroke="#bbb"/>
  <text x="366" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600">next build</text>
  <text x="366" y="96" fill="#555">prerenders every card</text>

  <rect x="366" y="112" width="238" height="44" rx="6" fill="#fff" stroke="#bbb"/>
  <text x="378" y="131" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">app/**/opengraph-image.tsx</text>
  <text x="378" y="148" fill="#555" font-size="12">7 files, about 50 cards</text>
  <line x1="485" y1="156" x2="485" y2="176" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="366" y="180" width="238" height="44" rx="6" fill="#fff" stroke="#bbb"/>
  <text x="378" y="199" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">renderOgImage()</text>
  <text x="378" y="216" fill="#555" font-size="12">lib/og-image.tsx</text>
  <line x1="485" y1="224" x2="485" y2="244" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="366" y="248" width="238" height="78" rx="6" fill="#fff" stroke="#bbb"/>
  <text x="378" y="267" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">loadFonts()</text>
  <text x="378" y="284" fill="#555" font-size="12">reads the three files from disk</text>
  <text x="378" y="306" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">ImageResponse(…, { fonts })</text>
  <text x="378" y="320" fill="#555" font-size="12">next/og, Satori</text>

  <line x1="620" y1="81" x2="666" y2="81" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Decision -->
  <rect x="670" y="50" width="260" height="62" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="686" y="74" font-weight="600">In the element's family?</text>
  <text x="686" y="94" fill="#555" font-size="12">only its first face counts</text>

  <line x1="720" y1="112" x2="720" y2="160" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="728" y="140" fill="#555" font-size="12">yes</text>
  <line x1="870" y1="112" x2="870" y2="160" stroke="#b3261e" stroke-width="1.5" marker-end="url(#r)"/>
  <text x="878" y="140" fill="#b3261e" font-size="12">no</text>

  <rect x="670" y="164" width="110" height="104" rx="8" fill="#eef6ee" stroke="#5a8a5a"/>
  <text x="682" y="188" font-weight="600">Baked</text>
  <text x="682" y="208" font-size="12">Latin titles,</text>
  <text x="682" y="224" font-size="12">λhux, paths,</text>
  <text x="682" y="240" font-size="12">meta digits</text>

  <rect x="796" y="164" width="134" height="104" rx="8" fill="#fbeeed" stroke="#b3261e"/>
  <text x="808" y="188" font-weight="600" font-size="12">loadDynamicAsset</text>
  <text x="808" y="208" font-size="12">next/og fetches</text>
  <text x="808" y="224" font-size="12">Noto Sans JP / SC</text>
  <text x="808" y="240" font-size="12">from Google Fonts</text>
  <text x="808" y="258" font-size="12" fill="#555">every Hanzi, today</text>

  <line x1="830" y1="268" x2="760" y2="310" stroke="#b3261e" stroke-width="1.5" marker-end="url(#r)"/>
  <line x1="880" y1="268" x2="880" y2="310" stroke="#b3261e" stroke-width="1.5" marker-end="url(#r)"/>

  <rect x="670" y="314" width="126" height="80" rx="8" fill="#fff" stroke="#b3261e"/>
  <text x="682" y="337" font-weight="600" font-size="12">reachable</text>
  <text x="682" y="356" font-size="12">a sans glyph, not</text>
  <text x="682" y="372" font-size="12">the serif title face</text>

  <rect x="808" y="314" width="122" height="80" rx="8" fill="#fff" stroke="#b3261e"/>
  <text x="820" y="337" font-weight="600" font-size="12">unreachable</text>
  <text x="820" y="356" font-size="12">a box (tofu);</text>
  <text x="820" y="372" font-size="12">no build error</text>

  <!-- Footnote -->
  <line x1="30" y1="424" x2="930" y2="424" stroke="#ddd"/>
  <text x="30" y="450" fill="#555" font-size="12">Satori picks a glyph from the first face registered under a family name and does not try a second face of the same name,</text>
  <text x="30" y="468" fill="#555" font-size="12">so noto-serif-sc-400.ttf is loaded but unused. The meta line is OgMono, which has no Hanzi either: "分钟" takes the red path on every zh card.</text>
</svg>
