<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <style>
      .t { font-size: 13px; fill: #1a1a1a; }
      .s { font-size: 11px; fill: #5c5c5c; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .b { font-weight: 600; }
      .box { fill: #f6f6f6; stroke: #bdbdbd; stroke-width: 1; }
      .col { fill: #fbfbfb; stroke: #d6d6d6; stroke-width: 1; }
      .rule { stroke: #e4e4e4; stroke-width: 1; }
      .ln { stroke: #555; stroke-width: 1.3; fill: none; }
      .pill-t { font-size: 12px; font-weight: 600; text-anchor: middle; }
    </style>
  </defs>
  <rect width="960" height="640" fill="#ffffff"/>

  <!-- the call -->
  <rect class="box" x="30" y="24" width="210" height="56" rx="8"/>
  <text class="t m b" x="46" y="48">open(set, index)</text>
  <text class="s" x="46" y="66">a cover, a card, a player on a row</text>
  <line class="ln" x1="240" y1="52" x2="274" y2="52" marker-end="url(#arr)"/>

  <rect class="box" x="276" y="24" width="250" height="56" rx="8"/>
  <text class="t m b" x="290" y="48">homeFor(media, ctx)</text>
  <text class="s m" x="290" y="66">systems/attachments/lib/policy.ts</text>
  <line class="ln" x1="526" y1="52" x2="558" y2="52" marker-end="url(#arr)"/>

  <!-- the one viewport fact -->
  <polygon points="660,10 760,52 660,94 560,52" fill="#fff7e0" stroke="#d9b44a" stroke-width="1.2"/>
  <text class="t m b" x="660" y="50" text-anchor="middle">ctx.compact?</text>
  <text class="s" x="660" y="66" text-anchor="middle">below sm (640px)</text>

  <!-- yes: phone -->
  <path class="ln" d="M660,94 L660,110 L455,110 L455,128" marker-end="url(#arr)"/>
  <text class="s b" x="468" y="103">yes: a phone</text>
  <!-- no: sm and up -->
  <path class="ln" d="M760,52 L790,52 L790,128" marker-end="url(#arr)"/>
  <text class="s b" x="800" y="104">no: sm and up</text>

  <!-- column heads -->
  <rect class="col" x="300" y="130" width="310" height="80" rx="8"/>
  <text class="t b" x="316" y="152"><tspan class="m">"surface"</tspan>: AttachmentSurface, a sheet</text>
  <text class="s" x="316" y="170">every kind, at the item tapped. Its page's button:</text>
  <text class="s m" x="316" y="188">act(set, i) → nativeHomeFor(media, ctx)</text>

  <rect class="col" x="636" y="130" width="300" height="80" rx="8"/>
  <text class="t b" x="652" y="152">straight to the native home</text>
  <text class="s" x="652" y="170">homeFor's own branches; the surface only</text>
  <text class="s" x="652" y="188">for a kind with no home of its own</text>

  <!-- row labels -->
  <text class="s b" x="30" y="236">MEDIA</text>
  <text class="s b" x="316" y="236">THE SHEET'S BUTTON SENDS IT TO</text>
  <text class="s b" x="652" y="236">A CLICK SENDS IT TO</text>
  <line class="rule" x1="30" y1="246" x2="936" y2="246"/>

  <!-- row 1: video / slides -->
  <text class="t b" x="30" y="272">video, slides</text>
  <text class="s m" x="30" y="290">isVideoMedia, isSlidesMedia</text>
  <rect x="316" y="260" width="78" height="24" rx="12" fill="#efe6fb" stroke="#9b6fd6"/>
  <text class="pill-t m" x="355" y="277" fill="#5b2d99">theater</text>
  <text class="s" x="404" y="272">the stage, a PiP on a phone;</text>
  <text class="s" x="404" y="288">the sheet closes</text>
  <rect x="652" y="260" width="78" height="24" rx="12" fill="#efe6fb" stroke="#9b6fd6"/>
  <text class="pill-t m" x="691" y="277" fill="#5b2d99">theater</text>
  <text class="s m" x="740" y="272">openMedia</text>
  <text class="s" x="740" y="288">picks the talks or the Slides library</text>
  <line class="rule" x1="30" y1="304" x2="936" y2="304"/>

  <!-- row 2: image -->
  <text class="t b" x="30" y="330">image</text>
  <text class="s m" x="30" y="348">isImageMedia</text>
  <rect x="316" y="318" width="78" height="24" rx="12" fill="#e2f4f1" stroke="#3fa595"/>
  <text class="pill-t m" x="355" y="335" fill="#1d6b5f">lightbox</text>
  <text class="s" x="404" y="330">ImageLightbox; the sheet steps</text>
  <text class="s" x="404" y="346">aside (two modals would fight)</text>
  <rect x="652" y="318" width="78" height="24" rx="12" fill="#e2f4f1" stroke="#3fa595"/>
  <text class="pill-t m" x="691" y="335" fill="#1d6b5f">lightbox</text>
  <text class="s" x="740" y="330">zoom and pan, on every viewport</text>
  <line class="rule" x1="30" y1="362" x2="936" y2="362"/>

  <!-- row 3: internal link -->
  <text class="t b" x="30" y="388">a link to this site</text>
  <text class="s m" x="30" y="406">isInternalLink (/writing/…)</text>
  <rect x="316" y="376" width="78" height="24" rx="12" fill="#e5f3e2" stroke="#5ea34f"/>
  <text class="pill-t m" x="355" y="393" fill="#2f6a24">route</text>
  <text class="s m" x="404" y="388">router.push</text>
  <text class="s" x="404" y="404">the sheet closes</text>
  <rect x="652" y="376" width="78" height="24" rx="12" fill="#e5f3e2" stroke="#5ea34f"/>
  <text class="pill-t m" x="691" y="393" fill="#2f6a24">route</text>
  <text class="s m" x="740" y="388">router.push</text>
  <line class="rule" x1="30" y1="420" x2="936" y2="420"/>

  <!-- row 4: unframeable link -->
  <text class="t b" x="30" y="446">a link that can't be framed</text>
  <text class="s m" x="30" y="464">preview.frame === "deny", isPdfLink</text>
  <rect x="316" y="434" width="78" height="24" rx="12" fill="#fdeedd" stroke="#d98a3a"/>
  <text class="pill-t m" x="355" y="451" fill="#8a4a0f">tab</text>
  <text class="s m" x="404" y="446">window.open</text>
  <text class="s" x="404" y="462">the sheet stays for the way back</text>
  <rect x="652" y="434" width="78" height="24" rx="12" fill="#fdeedd" stroke="#d98a3a"/>
  <text class="pill-t m" x="691" y="451" fill="#8a4a0f">tab</text>
  <text class="s" x="740" y="446">and a notice names the host</text>
  <text class="s m" x="740" y="462">showNotice (systems/dock)</text>
  <line class="rule" x1="30" y1="478" x2="936" y2="478"/>

  <!-- row 5: any other link -->
  <text class="t b" x="30" y="504">any other link</text>
  <text class="s" x="30" y="522"><tspan class="m">ctx.windows</tspan>; without it, <tspan class="m">tab</tspan></text>
  <rect x="316" y="492" width="78" height="24" rx="12" fill="#e3edfb" stroke="#4f86d4"/>
  <text class="pill-t m" x="355" y="509" fill="#1f4f94">window</text>
  <text class="s" x="404" y="504"><tspan class="m">openUrl</tspan>: a sheet stacked on</text>
  <text class="s" x="404" y="520">the attachment sheet, which stays</text>
  <rect x="652" y="492" width="78" height="24" rx="12" fill="#e3edfb" stroke="#4f86d4"/>
  <text class="pill-t m" x="691" y="509" fill="#1f4f94">window</text>
  <text class="s m" x="740" y="504">openUrl</text>
  <text class="s" x="740" y="520">the in-app browser window</text>
  <line class="rule" x1="30" y1="536" x2="936" y2="536"/>

  <!-- row 6: social widget -->
  <text class="t b" x="30" y="562">a social widget</text>
  <text class="s m" x="30" y="580">isSocialEmbedMedia</text>
  <rect x="316" y="550" width="78" height="24" rx="12" fill="#fdeedd" stroke="#d98a3a"/>
  <text class="pill-t m" x="355" y="567" fill="#8a4a0f">tab</text>
  <text class="s m" x="404" y="562">window.open</text>
  <text class="s" x="404" y="578">its platform's own page</text>
  <rect x="652" y="550" width="78" height="24" rx="12" fill="#eeeeee" stroke="#8c8c8c"/>
  <text class="pill-t m" x="691" y="567" fill="#3d3d3d">surface</text>
  <text class="s" x="740" y="562">a panel from sm, a window from lg</text>
  <text class="s m" x="740" y="578">ADAPTIVE_PRESENTATION</text>
  <line class="rule" x1="30" y1="594" x2="936" y2="594"/>

  <text class="s" x="30" y="620">Rows are checked top to bottom. The home ids are <tspan class="m">AttachmentHome</tspan> (lib/types.ts); each case is <tspan class="m">send()</tspan> in provider.tsx.</text>
</svg>
