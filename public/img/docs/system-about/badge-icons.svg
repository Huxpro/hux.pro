<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 700" width="760" height="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="760" height="700" fill="#fff"/>

  <!-- Authored -->
  <text x="20" y="26" font-size="11" font-weight="600" fill="#888" letter-spacing="0.5">AUTHORED</text>
  <rect x="20" y="38" width="230" height="92" rx="8" fill="#f4f6fb" stroke="#c9d1e3"/>
  <text x="32" y="60" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#222">&lt;Badge …&gt;</text>
  <text x="32" y="80" fill="#555">in content/** and docs/**</text>
  <text x="32" y="96" fill="#555">(.md, .mdx), read by</text>
  <text x="32" y="112" fill="#555">scripts/magic-link-tags.ts</text>

  <rect x="265" y="38" width="230" height="92" rx="8" fill="#f4f6fb" stroke="#c9d1e3"/>
  <text x="277" y="60" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#222">content/log.json</text>
  <text x="277" y="80" fill="#555">every listed project: its</text>
  <text x="277" y="96" fill="#555">/works row wears the same</text>
  <text x="277" y="112" fill="#555">mark (commitMark)</text>

  <rect x="510" y="38" width="230" height="92" rx="8" fill="#f4f6fb" stroke="#c9d1e3"/>
  <text x="522" y="60" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#222">content/badges.json</text>
  <text x="522" y="80" fill="#555">commits, identities: which site</text>
  <text x="522" y="96" fill="#555">icons: vendored, never crawled</text>
  <text x="522" y="112" fill="#555">(public/img/badges/)</text>

  <!-- arrows into badge-site -->
  <path d="M135,130 L300,176" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M380,130 L380,176" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M625,130 L460,176" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- The one rule -->
  <rect x="180" y="178" width="400" height="104" rx="8" fill="#eef7ee" stroke="#9cc79c"/>
  <text x="194" y="200" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#222">lib/badge-site.ts   badgeSiteUrl(spec)</text>
  <text x="194" y="220" fill="#555">role / identity: the identity's site (identities)</text>
  <text x="194" y="236" fill="#555">commit: the site named in commits, else its first external link</text>
  <text x="194" y="252" fill="#555">href: the URL. app, icon=, a path here, an image: no site</text>
  <text x="194" y="272" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#222">siteKey("https://youtu.be/…") → "youtube.com"</text>

  <path d="M260,282 L200,336" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M500,282 L560,316" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Ahead of time -->
  <text x="410" y="310" font-size="11" font-weight="600" fill="#888" letter-spacing="0.5">AHEAD OF TIME</text>
  <rect x="410" y="318" width="330" height="176" rx="8" fill="#fbf5ea" stroke="#dfc28f"/>
  <text x="422" y="340" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#222">scripts/badge-icon-snapshot.ts</text>
  <text x="422" y="364" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#222">pnpm badges:snapshot</text>
  <text x="422" y="382" fill="#555">per site: the badges.json icon, else crawl</text>
  <text x="422" y="398" fill="#555">manifest → apple-touch-icon → favicon;</text>
  <text x="422" y="414" fill="#555">a failed crawl keeps the prior icon</text>
  <text x="422" y="440" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#222">pnpm badges:check   (CI)</text>
  <text x="422" y="458" fill="#555">filesystem only; fails on a site with no</text>
  <text x="422" y="474" fill="#555">icon, a missing file, or a stale entry</text>

  <path d="M575,494 L575,528" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="410" y="530" width="330" height="76" rx="8" fill="#f4f4f4" stroke="#bbb" stroke-dasharray="5 3"/>
  <text x="422" y="552" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#222">content/badge-icons.json</text>
  <text x="422" y="571" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#222">public/badge-icons/&lt;site&gt;.&lt;ext&gt;</text>
  <text x="422" y="592" fill="#555">generated and committed, keyed by site</text>

  <path d="M410,560 L372,520" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- On the page -->
  <text x="20" y="330" font-size="11" font-weight="600" fill="#888" letter-spacing="0.5">ON THE PAGE</text>
  <rect x="20" y="338" width="350" height="196" rx="8" fill="#eef3fb" stroke="#9fb6dc"/>
  <text x="32" y="360" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#222">components/magic-link/resolve.ts</text>
  <text x="32" y="381" fill="#555">the first that applies:</text>
  <text x="32" y="401" fill="#333">1. icon= : that path, URL or app's icon</text>
  <text x="32" y="419" fill="#333">2. app= : its home-screen icon</text>
  <text x="32" y="437" fill="#333">3. href= a path here: /icons/icon.svg</text>
  <text x="32" y="455" fill="#333">4. href= an image: the image itself</text>
  <text x="32" y="473" fill="#333">5. its site's snapshotted icon (siteIcon)</text>
  <text x="32" y="491" fill="#333">6. none: a monogram, or the kind's glyph</text>
  <text x="32" y="515" font-size="11" fill="#777">(6 is what badges:check exists to prevent)</text>

  <path d="M195,534 L195,566" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="20" y="568" width="350" height="110" rx="8" fill="#f4f6fb" stroke="#c9d1e3"/>
  <text x="32" y="590" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#222">BadgeMark  <tspan font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" fill="#777">magic-link.tsx</tspan></text>
  <text x="32" y="612" fill="#555">a manifest or apple-touch-icon, or any</text>
  <text x="32" y="628" fill="#555">square ≥160px: <tspan fill="#222">fills its tile</tspan></text>
  <text x="32" y="650" fill="#555">a favicon: <tspan fill="#222">on a white plate</tspan>, so a black</text>
  <text x="32" y="666" fill="#555">mark still reads in the dark</text>

  <!-- note -->
  <text x="410" y="640" fill="#555">The script and the component ask</text>
  <text x="410" y="656" fill="#555">badge-site.ts the same question, so the</text>
  <text x="410" y="672" fill="#555">snapshot holds exactly the icons the</text>
  <text x="410" y="688" fill="#555">page will look up.</text>
</svg>
