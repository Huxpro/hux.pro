<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="760" height="470" fill="#ffffff"/>

  <!-- ============ Keyboard down ============ -->
  <text x="130" y="26" text-anchor="middle" font-size="14" font-weight="600" fill="#111">Keyboard down</text>
  <!-- screen -->
  <rect x="40" y="40" width="180" height="400" rx="26" fill="#cfe3fb" stroke="#222" stroke-width="2"/>
  <!-- popup: fixed-height positioning box -->
  <rect x="49" y="56" width="162" height="372" rx="20" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
  <!-- shell (glass) -->
  <rect x="52" y="59" width="156" height="366" rx="18" fill="#f8fbff" stroke="#9ab" stroke-width="1"/>
  <rect x="112" y="66" width="36" height="4" rx="2" fill="#c3cad4"/>
  <!-- header -->
  <rect x="60" y="76" width="140" height="18" rx="4" fill="#e5e9f0"/>
  <text x="66" y="89" fill="#555" font-size="10">header · shrink-0</text>
  <!-- content -->
  <rect x="60" y="100" width="140" height="262" rx="4" fill="#eef4ff" stroke="#b9cdf0" stroke-dasharray="3 3"/>
  <text x="130" y="226" text-anchor="middle" fill="#3b5b8f" font-size="11">content</text>
  <text x="130" y="241" text-anchor="middle" fill="#3b5b8f" font-size="10">min-h-0 flex-1</text>
  <text x="130" y="254" text-anchor="middle" fill="#3b5b8f" font-size="10">overflow-y-auto</text>
  <!-- footer field -->
  <rect x="60" y="370" width="140" height="46" rx="10" fill="#ffffff" stroke="#7c8696" stroke-width="1.5"/>
  <text x="130" y="390" text-anchor="middle" fill="#111" font-size="11">field</text>
  <text x="130" y="404" text-anchor="middle" fill="#555" font-size="10">footer · shrink-0</text>

  <!-- ============ Keyboard up ============ -->
  <text x="420" y="26" text-anchor="middle" font-size="14" font-weight="600" fill="#111">Keyboard up</text>
  <rect x="330" y="40" width="180" height="400" rx="26" fill="#cfe3fb" stroke="#222" stroke-width="2"/>
  <!-- popup: same box, same height -->
  <rect x="339" y="56" width="162" height="372" rx="20" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
  <!-- keyboard (drawn over the screen bottom) -->
  <path d="M330 274 H510 V414 A26 26 0 0 1 484 440 H356 A26 26 0 0 1 330 414 Z" fill="#c9ccd2" stroke="#222" stroke-width="2"/>
  <g fill="#f5f6f8">
    <rect x="340" y="282" width="16" height="20" rx="3"/><rect x="360" y="282" width="16" height="20" rx="3"/><rect x="380" y="282" width="16" height="20" rx="3"/><rect x="400" y="282" width="16" height="20" rx="3"/><rect x="420" y="282" width="16" height="20" rx="3"/><rect x="440" y="282" width="16" height="20" rx="3"/><rect x="460" y="282" width="16" height="20" rx="3"/><rect x="480" y="282" width="16" height="20" rx="3"/>
    <rect x="350" y="308" width="16" height="20" rx="3"/><rect x="370" y="308" width="16" height="20" rx="3"/><rect x="390" y="308" width="16" height="20" rx="3"/><rect x="410" y="308" width="16" height="20" rx="3"/><rect x="430" y="308" width="16" height="20" rx="3"/><rect x="450" y="308" width="16" height="20" rx="3"/><rect x="470" y="308" width="16" height="20" rx="3"/>
    <rect x="380" y="360" width="80" height="20" rx="3"/>
  </g>
  <text x="420" y="404" text-anchor="middle" fill="#333" font-size="11">software keyboard</text>
  <!-- shell, shorter: same top, bottom on the keyboard -->
  <rect x="342" y="59" width="156" height="200" rx="18" fill="#f8fbff" stroke="#9ab" stroke-width="1"/>
  <rect x="402" y="66" width="36" height="4" rx="2" fill="#c3cad4"/>
  <rect x="350" y="76" width="140" height="18" rx="4" fill="#e5e9f0"/>
  <text x="356" y="89" fill="#555" font-size="10">header · shrink-0</text>
  <rect x="350" y="100" width="140" height="96" rx="4" fill="#eef4ff" stroke="#b9cdf0" stroke-dasharray="3 3"/>
  <text x="420" y="146" text-anchor="middle" fill="#3b5b8f" font-size="11">content</text>
  <text x="420" y="161" text-anchor="middle" fill="#3b5b8f" font-size="10">gives up the height</text>
  <rect x="350" y="204" width="140" height="46" rx="10" fill="#ffffff" stroke="#7c8696" stroke-width="1.5"/>
  <text x="420" y="224" text-anchor="middle" fill="#111" font-size="11">field</text>
  <text x="420" y="238" text-anchor="middle" fill="#555" font-size="10">rests on the keyboard</text>

  <!-- ============ Annotations ============ -->
  <g fill="#222" font-size="11.5">
    <line x1="501" y1="66" x2="540" y2="66" stroke="#6b7280" stroke-dasharray="4 3"/>
    <text x="546" y="62" font-weight="600">Drawer.Popup</text>
    <text x="546" y="77" fill="#555">transparent, fixed height</text>
    <text x="546" y="91" fill="#555">(detent or `height`)</text>

    <line x1="498" y1="120" x2="540" y2="120" stroke="#9ab"/>
    <text x="546" y="116" font-weight="600">[data-surface-shell]</text>
    <text x="546" y="131" fill="#555">the glass, flex-1 in the popup</text>

    <path d="M516 259 H526 V425 H516" fill="none" stroke="#f08a24" stroke-width="2"/>
    <line x1="526" y1="342" x2="540" y2="342" stroke="#f08a24" stroke-width="2"/>
    <text x="546" y="331" font-weight="600">shell margin-bottom</text>
    <text x="546" y="346" fill="#555">= --drawer-keyboard-inset</text>
    <text x="546" y="361" fill="#555">(Base UI, from visualViewport),</text>
    <text x="546" y="376" fill="#555">transitioned on the surface curve</text>

    <line x1="230" y1="59" x2="322" y2="59" stroke="#888" marker-end="url(#arrow)"/>
    <text x="276" y="52" text-anchor="middle" fill="#555" font-size="10.5">top stays</text>
    <line x1="230" y1="425" x2="322" y2="259" stroke="#888" marker-end="url(#arrow)"/>
    <text x="284" y="340" fill="#555" font-size="10.5">bottom</text>
    <text x="284" y="353" fill="#555" font-size="10.5">rises</text>
  </g>
  <text x="380" y="462" text-anchor="middle" fill="#666" font-size="11">A bottom margin on a flex-1 child of a fixed-height box shortens the child: the glass shrinks from the bottom instead of sliding up.</text>
</svg>
