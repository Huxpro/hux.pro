<text x="40" y="272" font-size="12" fill="#1a1a1a">The phase is a label for words and the Classic palette. The Sky and the Gradient follow the sun's elevation to the minute, not the phase.</text>
<text x="40" y="292" font-size="12" fill="#1a1a1a">Without sun times there are no sunrise/sunset phases: getTimeOfDay() uses the local clock (05, 12, 17, 21).</text>
