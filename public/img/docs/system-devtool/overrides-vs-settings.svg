<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 640" width="820" height="640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; fill: #222; }
      .h { font-weight: 600; font-size: 14px; fill: #111; }
      .note { font-size: 12px; fill: #444; }
      .amber { fill: #d97706; font-weight: 700; }
      .sky { fill: #0284c7; font-weight: 700; }
    </style>
  </defs>
  <rect x="0" y="0" width="820" height="640" fill="#ffffff"/>

  <text x="16" y="28" class="h">A row's write, by where it goes; the star's colour says which</text>

  <!-- Session lane -->
  <rect x="16" y="46" width="404" height="160" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="30" y="72" class="h">Session override <tspan class="amber">*</tspan> <tspan class="note" font-weight="400">PanelStar source="session"</tspan></text>
  <text x="30" y="98" class="mono">devtoolOverrides: full · widget · softEdging</text>
  <text x="30" y="115" class="mono">  · bezel · scroll · noWebGL   (useWallpaper)</text>
  <text x="30" y="138" class="mono">debugOverride · sceneOverrides (useWeather)</text>
  <text x="30" y="161" class="mono">timeScrubMinutes · dayOffset (useAmbientTime)</text>
  <text x="30" y="184" class="mono">heroExitOverride (useDevtool)</text>

  <rect x="446" y="46" width="170" height="160" rx="10" fill="#f5f5f5" stroke="#999"/>
  <text x="460" y="72" class="h">useState only</text>
  <text x="460" y="98" class="note">gone on reload</text>
  <text x="460" y="120" class="note">counts only while</text>
  <text x="460" y="138" class="mono">isEnabled</text>
  <text x="460" y="162" class="note">bezel / soft-edge also</text>
  <text x="460" y="180" class="note">drop on a new wallpaper</text>
  <text x="460" y="198" class="note">family (edgeFamily)</text>
  <line x1="420" y1="126" x2="442" y2="126" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Saved lane -->
  <rect x="16" y="226" width="404" height="246" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="30" y="252" class="h">Saved setting <tspan class="sky">*</tspan> <tspan class="note" font-weight="400">PanelStar source="saved"</tspan></text>
  <text x="30" y="278" class="mono">hux_ambient_settings: style · bezel tint /</text>
  <text x="30" y="295" class="mono">  band / radius · reading blur / dim · gyro</text>
  <text x="30" y="318" class="mono">hux_theme (Follow the Sun) · hux_glass_tint</text>
  <text x="30" y="341" class="mono">hux_reading_* · hux_bleed_enabled</text>
  <text x="30" y="358" class="mono">  · hux_ruler_side</text>
  <text x="30" y="381" class="mono">hux_ask_config · hux_ask_model · hux_ask_effort</text>
  <text x="30" y="404" class="mono">hux_voice_model · hux_voice_visual</text>
  <text x="30" y="421" class="mono">  · hux_glow_v2 · hux_music_mock</text>
  <text x="30" y="444" class="mono">hux_devtool: phonePalette · homeWeather</text>
  <text x="30" y="461" class="mono">  · worksRef / Shelf / Feed · draggable</text>

  <rect x="446" y="226" width="170" height="246" rx="10" fill="#f5f5f5" stroke="#999"/>
  <text x="460" y="252" class="h">localStorage</text>
  <text x="460" y="278" class="note">survives reload</text>
  <text x="460" y="302" class="note">applies with the</text>
  <text x="460" y="320" class="note">devtool off</text>
  <text x="460" y="344" class="note">the same store the</text>
  <text x="460" y="362" class="note">picker and ⌘K write:</text>
  <text x="460" y="380" class="note">one value, two controls</text>
  <line x1="420" y1="349" x2="442" y2="349" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Aggregation -->
  <rect x="640" y="46" width="160" height="124" rx="10" fill="#ffffff" stroke="#555"/>
  <text x="654" y="72" class="h">DebugSection star</text>
  <text x="654" y="96" class="mono">strongest(…)</text>
  <text x="654" y="118" class="note">any <tspan class="amber">*</tspan> → amber</text>
  <text x="654" y="138" class="note">else any <tspan class="sky">*</tspan> → blue</text>
  <text x="654" y="158" class="note">else none</text>
  <line x1="616" y1="108" x2="636" y2="108" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="616" y1="300" x2="636" y2="152" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="640" y="196" width="160" height="100" rx="10" fill="#ffffff" stroke="#555"/>
  <text x="654" y="222" class="h">DevtoolRail chip</text>
  <text x="654" y="246" class="note">the same star, so a</text>
  <text x="654" y="266" class="note">folded module still</text>
  <text x="654" y="284" class="note">says "look in here"</text>
  <line x1="700" y1="170" x2="700" y2="192" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="640" y="316" width="160" height="156" rx="10" fill="#ffffff" stroke="#555"/>
  <text x="654" y="340" class="h">relevant (the fold)</text>
  <text x="654" y="362" class="note"><tspan class="amber">*</tspan> pulls the module</text>
  <text x="654" y="378" class="note">open: you are in the</text>
  <text x="654" y="396" class="note">middle of something</text>
  <text x="654" y="420" class="note"><tspan class="sky">*</tspan> does not: it would</text>
  <text x="654" y="438" class="note">hold the module open</text>
  <text x="654" y="456" class="note">on every page, for good</text>
  <path d="M800,96 H811 V390 H804" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- No star -->
  <rect x="16" y="496" width="784" height="128" rx="10" fill="#fafafa" stroke="#bbb" stroke-dasharray="5 4"/>
  <text x="30" y="522" class="h">No star: the devtool's own state</text>
  <text x="30" y="548" class="mono">hux_devtool: fabEnabled · detached · collapsed (keys id:relevant / id:idle)</text>
  <text x="30" y="570" class="mono">hux_drag_&lt;id&gt; (positions, while persist is on)</text>
  <text x="30" y="592" class="mono">railFolds · solo (memory only, cleared on a new route)</text>
  <text x="30" y="612" class="note">Where the devtool is and what is folded is not a setting of the site, so nothing marks it.</text>
</svg>
