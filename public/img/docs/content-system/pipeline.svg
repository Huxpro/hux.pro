<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 690" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <style>
      .h { font-size: 15px; font-weight: 600; fill: #111827; }
      .lbl { font-size: 12px; fill: #6b7280; }
      .t { font-size: 12.5px; fill: #374151; }
      .c { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #1f2937; }
      .cs { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; fill: #374151; }
      .box { fill: #f5f6f8; stroke: #c4cad3; stroke-width: 1.2; }
      .inner { fill: #ffffff; stroke: #d6dbe2; stroke-width: 1; }
      .build { fill: #fbf7ee; stroke: #dccaa3; stroke-width: 1.2; }
      .ln { stroke: #4b5563; stroke-width: 1.5; fill: none; }
      .bus { stroke: #9a8257; stroke-width: 1.5; fill: none; }
    </style>
  </defs>
  <rect width="1160" height="690" fill="#ffffff"/>

  <!-- Column headers -->
  <text class="lbl" x="20" y="28">ON DISK</text>
  <text class="lbl" x="262" y="28">READ (server, build time)</text>
  <text class="lbl" x="552" y="28">ROUTE</text>
  <text class="lbl" x="842" y="28">COMPILE + RENDER</text>

  <!-- Files -->
  <rect class="box" x="20" y="40" width="210" height="300" rx="10"/>
  <text class="h" x="34" y="64">Files</text>
  <rect class="inner" x="32" y="76" width="186" height="118" rx="6"/>
  <text class="c" x="42" y="96">content/blog/</text>
  <text class="cs" x="52" y="118">slug.en.mdx</text>
  <text class="cs" x="52" y="136">slug.zh.mdx</text>
  <text class="cs" x="52" y="154">slug/index.en.mdx</text>
  <text class="cs" x="52" y="172">slug/index.zh.mdx</text>
  <rect class="inner" x="32" y="204" width="186" height="124" rx="6"/>
  <text class="c" x="42" y="224">docs/</text>
  <text class="cs" x="52" y="246">slug.md</text>
  <text class="lbl" x="52" y="264">or, per language:</text>
  <text class="cs" x="52" y="282">slug.en.md(x)</text>
  <text class="cs" x="52" y="300">slug.zh.md(x)</text>
  <text class="lbl" x="52" y="318">.mdx wins over .md</text>

  <!-- lib/mdx.ts -->
  <rect class="box" x="262" y="40" width="258" height="300" rx="10"/>
  <text class="h" x="276" y="64">lib/mdx.ts</text>
  <text class="c" x="276" y="90">getBlogSlugs()</text>
  <text class="c" x="276" y="108">getBlogPostBySlug(slug)</text>
  <text class="c" x="276" y="126">getAllBlogPosts()</text>
  <text class="c" x="276" y="144">getBlogLangManifest()</text>
  <text class="c" x="276" y="168">getDocSlugs()</text>
  <text class="c" x="276" y="186">getDocBySlug(slug)</text>
  <text class="c" x="276" y="204">getAllDocs()</text>
  <line x1="276" y1="220" x2="506" y2="220" stroke="#d6dbe2"/>
  <text class="t" x="276" y="240">language: en | zh | both,</text>
  <text class="t" x="276" y="257">from which files exist</text>
  <text class="t" x="276" y="279">post fields: gray-matter frontmatter</text>
  <text class="t" x="276" y="296">doc title: first # heading</text>
  <text class="t" x="276" y="318">derived: excerpt, cover, readingTime</text>

  <!-- Route -->
  <rect class="box" x="552" y="40" width="258" height="300" rx="10"/>
  <text class="h" x="566" y="64">Route pages</text>
  <rect class="inner" x="564" y="76" width="234" height="58" rx="6"/>
  <text class="c" x="574" y="96">middleware.ts</text>
  <text class="t" x="574" y="116">bare URL → /…/&lt;locale cookie&gt;</text>
  <text class="c" x="566" y="160">app/writing/[slug]/[lang]/</text>
  <text class="c" x="566" y="178">app/docs/[...slug]/</text>
  <line x1="566" y1="194" x2="796" y2="194" stroke="#d6dbe2"/>
  <text class="t" x="566" y="214">generateStaticParams:</text>
  <text class="t" x="566" y="231">one page per language that exists</text>
  <text class="t" x="566" y="255">picks content or contentZh</text>
  <text class="t" x="566" y="272">for the [lang] segment</text>
  <text class="t" x="566" y="296">docs: strips the first # line</text>
  <text class="t" x="566" y="318">(PostContent prints the title)</text>

  <!-- Renderer -->
  <rect class="box" x="842" y="40" width="298" height="300" rx="10"/>
  <text class="h" x="856" y="64">MDXRenderer</text>
  <text class="cs" x="856" y="84">components/mdx-renderer.tsx</text>
  <text class="c" x="856" y="106">&lt;MDXRemote source options components/&gt;</text>
  <rect class="inner" x="854" y="118" width="274" height="86" rx="6"/>
  <text class="c" x="864" y="138">mdxOptions</text>
  <text class="cs" x="950" y="138">lib/mdx-processor.ts</text>
  <text class="t" x="864" y="158">blockJS: false</text>
  <text class="t" x="864" y="176">remark-gfm, remark-math</text>
  <text class="t" x="864" y="194">rehype-pretty-code (Shiki)</text>
  <rect class="inner" x="854" y="212" width="274" height="116" rx="6"/>
  <text class="c" x="864" y="232">mdxComponents</text>
  <text class="cs" x="972" y="232">mdx-components.tsx</text>
  <text class="t" x="864" y="252">img → MdxImage (#bleed)</text>
  <text class="t" x="864" y="270">pre → CodeBlock</text>
  <text class="t" x="864" y="288">a → ServerProseLink</text>
  <text class="t" x="864" y="306">h1–h3 → HeadingWithLink</text>
  <text class="t" x="864" y="322">Figure, Badge, MagicLink, …</text>

  <!-- Main flow arrows -->
  <line class="ln" x1="230" y1="190" x2="258" y2="190" marker-end="url(#arrow)"/>
  <line class="ln" x1="520" y1="190" x2="548" y2="190" marker-end="url(#arrow)"/>
  <line class="ln" x1="810" y1="190" x2="838" y2="190" marker-end="url(#arrow)"/>
  <text class="lbl" x="842" y="362">→ static HTML, one page per language:</text>
  <text class="cs" x="842" y="380">/writing/&lt;slug&gt;/&lt;lang&gt;   /docs/&lt;slug&gt;/&lt;lang&gt;</text>

  <!-- Build-time readers -->
  <text class="lbl" x="20" y="672">BUILD-TIME READERS: the same files, read without compiling MDX</text>

  <!-- buses -->
  <path class="bus" d="M125,340 L125,410 L330,410"/>
  <path class="bus" d="M125,410 L125,466" marker-end="url(#arrow)"/>
  <path class="bus" d="M330,410 L330,466" marker-end="url(#arrow)"/>
  <text class="lbl" x="134" y="402">read the files directly</text>

  <path class="bus" d="M391,340 L391,430 L1035,430"/>
  <path class="bus" d="M545,430 L545,466" marker-end="url(#arrow)"/>
  <path class="bus" d="M790,430 L790,466" marker-end="url(#arrow)"/>
  <path class="bus" d="M1035,430 L1035,466" marker-end="url(#arrow)"/>
  <text class="lbl" x="600" y="422">through lib/mdx.ts</text>

  <rect class="build" x="20" y="470" width="200" height="166" rx="10"/>
  <text class="c" x="32" y="494">pnpm og:fonts</text>
  <text class="cs" x="32" y="514">scripts/og-fonts.mjs</text>
  <text class="t" x="32" y="538">post titles + descriptions</text>
  <text class="t" x="32" y="556">(top-level .mdx only)</text>
  <text class="t" x="32" y="580">→ lib/og-fonts/</text>
  <text class="t" x="32" y="598">the CJK glyph subset</text>

  <rect class="build" x="230" y="470" width="200" height="166" rx="10"/>
  <text class="c" x="242" y="494">pnpm badges:snapshot</text>
  <text class="cs" x="242" y="514">scripts/magic-link-tags.ts</text>
  <text class="t" x="242" y="538">every &lt;Badge&gt; / &lt;MagicLink&gt;</text>
  <text class="t" x="242" y="556">in content/ and docs/</text>
  <text class="t" x="242" y="580">→ content/badge-icons.json</text>
  <text class="t" x="242" y="598">CI: badges:check</text>

  <rect class="build" x="440" y="470" width="210" height="166" rx="10"/>
  <text class="c" x="452" y="494">pnpm ask:index</text>
  <text class="cs" x="452" y="514">lib/ask-corpus.ts</text>
  <text class="t" x="452" y="538">posts (not docs), per language</text>
  <text class="t" x="452" y="556">runs in predev and build</text>
  <text class="t" x="452" y="580">→ public/ask/index.json</text>
  <text class="t" x="452" y="598">gitignored</text>

  <rect class="build" x="660" y="470" width="260" height="166" rx="10"/>
  <text class="c" x="672" y="494">pnpm og:sizes · og:snapshot</text>
  <text class="cs" x="672" y="514">scripts/og-snapshot.ts</text>
  <text class="t" x="672" y="538">each post's cover (first image);</text>
  <text class="t" x="672" y="556">cards that point at a post</text>
  <text class="t" x="672" y="580">→ content/image-sizes.json,</text>
  <text class="t" x="672" y="598">content/og-snapshot.json</text>
  <text class="t" x="672" y="616">CI: og:complete</text>

  <rect class="build" x="930" y="470" width="210" height="166" rx="10"/>
  <text class="c" x="942" y="494">opengraph-image</text>
  <text class="cs" x="942" y="514">app/writing/[slug]/[lang]/</text>
  <text class="t" x="942" y="538">the post's share card,</text>
  <text class="t" x="942" y="556">rendered by next build</text>
  <text class="t" x="942" y="580">reads lib/og-fonts/</text>
  <text class="t" x="942" y="598">nothing to run</text>
</svg>
